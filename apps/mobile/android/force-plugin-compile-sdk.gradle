// Agora 6.6.x currently declares Android API 31 in its plugin module,
// while its AndroidX AAR dependencies require compileSdk 34+. Apply this
// after each Android subproject has evaluated its own build.gradle so the
// plugin's compileSdkVersion(31) cannot overwrite the app-compatible API 37.
// This does not change minSdk or targetSdk runtime behavior.
subprojects { pluginProject ->
    pluginProject.afterEvaluate {
        def androidExtension = pluginProject.extensions.findByName("android")
        if (androidExtension != null) {
            androidExtension.compileSdkVersion(37)
        }
    }
}
