name: darkvibex
description: DarkVibeX social voice-room application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.13.0
  google_sign_in: ^7.2.0
  country_picker: ^2.0.28
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/greedy_girl_mascot.webp
    - assets/images/cp_card_reference.webp
    - assets/images/vs_card_reference.webp
    - assets/images/friend_lock_card_ref.webp
    - assets/images/friend_add_card_ref.webp
