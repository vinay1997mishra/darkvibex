name: darkvibex
description: DarkVibeX social voice-room application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  agora_rtc_engine: ^6.6.4
  google_sign_in: ^7.2.0
  country_picker: ^2.0.28
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  video_player: ^2.10.1
  # Tencent VAP (Video Animation Player) — plays the transparent VIP
  # frame videos (vap/vip<N>-<animal>.mp4, H.264 with the alpha mask on
  # the LEFT half of the frame). video_player cannot show video alpha
  # (opaque texture -> black box); VAP is the industry-standard player
  # for live-app gift/frame animations. ^2.2.0 (2026-10-15), Dart
  # ^3.10.4 / Flutter >=3.22.0 — compatible with this app (sdk
  # >=3.12.0). Android only needs the plugin; no manifest changes.
  flutter_vap_player: ^2.2.0
  # SVGA player (Vinay, 2026-11-22): plays SVGA gift animations made
  # from pictures + keyframes (gifts/svga/*.svga on R2). flutter_svga
  # 0.0.14 (2026-10-16) is the active replacement for the archived
  # svgaplayer_flutter 2.2.0, which needs Dart <3.0.0 and cannot be
  # used with this app (sdk >=3.12.0). Dart 3.14 / Flutter 3.50 OK.
  flutter_svga: ^0.0.14
  model_viewer_plus: ^1.10.0
  flutter_svg: ^2.2.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/darkvibex_launcher.webp
    - assets/images/greedy_girl_mascot.webp
    - assets/images/gold_trophy.png
    - assets/images/gold_lamp.png
    # Family main page (Mr. Wrong, 2026-11-24 — v9): light glass
    # purple+gold background, shared by the Create Family page.
    - assets/images/shield_gold.png
    - assets/images/shield_blue.png
    - assets/images/shield_orange.png
    - assets/images/gold_crown.png
    - assets/images/family_bg_light.png
    # Family detail page (Mr. Wrong, 2026-11-24): original purple+gold
    # models for the new detail design — cover, notice banner, level
    # badge, EXP crystal, Lucky Wheel. Made for DarkVibeX, not copied.
    - assets/images/family_cover_new.webp
    - assets/images/family_banner_new.webp
    - assets/images/family_level_badge.webp
    - assets/images/family_exp_crystal.webp
    - assets/images/family_lucky_wheel.webp
    - assets/images/cp_card_reference.webp
    - assets/images/vs_card_reference.webp
    - assets/images/friend_lock_card_ref.webp
    - assets/images/friend_add_card_ref.webp
    - assets/images/darkvibex_global_bg.webp
    - assets/images/ring_heart.svg
    - assets/images/ring_crystal.svg
    - assets/images/ring_royal.svg
    - assets/vip18/
    - assets/medals/
    # Call ringtones (Vinay, 2026-11-21): the user picks one as the
    # caller tune that rings on incoming unmuted calls. The same files
    # also live in android/app/src/main/res/raw/ so the native
    # notification can play the selected tone while the app is closed.
    - assets/ringtones/
