name: DarkVibeX Build

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  pull_request:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "DarkVibeX Worker public origin"
        required: false
        default: "https://darkvibex-api.mishrajii7991.workers.dev"
        type: string

permissions:
  contents: write
  statuses: write

concurrency:
  group: darkvibex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Worker syntax
        run: |
          node --check src/index.js
          node --check src/owner_api.js
          node --check src/vip_policy.js
          node --check src/vip_store.js
          node --check src/vip_actions.js
          node --check src/aladdin_lamp.js
          node --check ../owner_panel/app.js
      - name: Safe hierarchy policy
        working-directory: .
        run: node tools/check-no-legacy-hierarchy.mjs
      - name: Worker policy tests
        run: npm test
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/darkvibex-worker

  android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    env:
      DVX_API_ORIGIN: ${{ inputs.api_origin || 'https://darkvibex-api.mishrajii7991.workers.dev' }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
      # Firebase Android config is injected from the repository secret at build time.
      DVX_PUSH_CONFIGURED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Mark APK build pending
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=darkvibex/apk \
            -f description="DarkVibeX APK build is running"
      - name: Free unused Android runner storage
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android scaffold
        working-directory: apps/mobile
        run: |
          cp -R lib /tmp/dvx-lib
          cp -R test /tmp/dvx-test
          cp pubspec.yaml /tmp/dvx-pubspec.yaml
          cp android/app/build.gradle.kts /tmp/dvx-build.gradle.kts
          cp android/app/src/main/AndroidManifest.xml /tmp/dvx-manifest.xml
          cp android/app/src/main/kotlin/com/darkvibex/app/MainActivity.kt /tmp/dvx-main-activity.kt
          cp android/app/src/main/kotlin/com/darkvibex/app/DarkVibeXRoomForegroundService.kt /tmp/dvx-room-service.kt
          cp android/app/src/main/kotlin/com/darkvibex/app/DarkVibeXMessagingService.kt /tmp/dvx-messaging-service.kt
          flutter create --platforms=android --org com.darkvibex --project-name app .
          rm -rf lib test
          cp -R /tmp/dvx-lib lib
          cp -R /tmp/dvx-test test
          cp /tmp/dvx-pubspec.yaml pubspec.yaml
          cp /tmp/dvx-build.gradle.kts android/app/build.gradle.kts
          cp /tmp/dvx-manifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/darkvibex/app
          cp /tmp/dvx-main-activity.kt android/app/src/main/kotlin/com/darkvibex/app/MainActivity.kt
          cp /tmp/dvx-room-service.kt android/app/src/main/kotlin/com/darkvibex/app/DarkVibeXRoomForegroundService.kt
          cp /tmp/dvx-messaging-service.kt android/app/src/main/kotlin/com/darkvibex/app/DarkVibeXMessagingService.kt

      - name: Configure optional Firebase message push
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "DVX_PUSH_CONFIGURED=false" >> "$GITHUB_ENV"
          if [ -z "${FIREBASE_ANDROID_CONFIG_JSON:-}" ]; then
            echo "Firebase Android config secret is not set; message push stays disabled."
            exit 0
          fi
          mkdir -p android/app/src/main/res/values
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.FIREBASE_ANDROID_CONFIG_JSON || '';
          const config = JSON.parse(raw);
          const clients = Array.isArray(config.client) ? config.client : [];
          const client = clients.find((item) =>
            item?.client_info?.android_client_info?.package_name === 'com.darkvibex.app'
          ) || clients[0];
          if (!client) throw new Error('Firebase Android client is missing');
          const appId = String(client?.client_info?.mobilesdk_app_id || '').trim();
          const apiKey = String(client?.api_key?.[0]?.current_key || '').trim();
          const senderId = String(config?.project_info?.project_number || '').trim();
          const projectId = String(config?.project_info?.project_id || '').trim();
          const bucket = String(config?.project_info?.storage_bucket || '').trim();
          if (!appId || !apiKey || !senderId || !projectId) {
            throw new Error('Firebase Android config is incomplete');
          }
          const escapeXml = (value) => value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
          const values = [
            ['google_app_id', appId],
            ['google_api_key', apiKey],
            ['gcm_defaultSenderId', senderId],
            ['project_id', projectId],
          ];
          if (bucket) values.push(['google_storage_bucket', bucket]);
          const xml = [
            '<?xml version="1.0" encoding="utf-8"?>',
            '<resources>',
            ...values.map(([name, value]) =>
              `    <string name="${name}" translatable="false">${escapeXml(value)}</string>`
            ),
            '</resources>',
            '',
          ].join('\n');
          fs.writeFileSync(
            'android/app/src/main/res/values/firebase_push.xml',
            xml,
          );
          NODE
          echo "DVX_PUSH_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "Firebase message push config generated for com.darkvibex.app."

      - name: Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Prepare required Android NDK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="28.2.13676358"
          ndk_folder="android-ndk-r28c"
          ndk_zip_url="https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          target="$sdk_root/ndk/$ndk_version"

          if [ -f "$target/source.properties" ]; then
            echo "NDK $ndk_version already installed."
            exit 0
          fi

          # First use the Android SDK manager. If its cached archive is corrupt,
          # fall back to a validated direct Google download instead of failing the APK.
          if [ -x "$sdkmanager" ]; then
            rm -rf "$target" "$sdk_root/.temp"/* 2>/dev/null || true
            rm -rf "${HOME}/.android/cache" 2>/dev/null || true
            mkdir -p "${HOME}/.android"
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
            if "$sdkmanager" --install "ndk;$ndk_version" &&
               [ -f "$target/source.properties" ]; then
              echo "NDK $ndk_version installed with sdkmanager."
              exit 0
            fi
          fi

          echo "sdkmanager NDK install failed; using validated direct download."
          mkdir -p "$sdk_root/ndk"
          archive="$RUNNER_TEMP/android-ndk-r28c-linux.zip"
          extract_dir="$RUNNER_TEMP/android-ndk-r28c-extract"
          for attempt in 1 2 3; do
            echo "Direct NDK download attempt $attempt/3"
            rm -f "$archive"
            rm -rf "$extract_dir" "$target"
            mkdir -p "$extract_dir"
            if curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
                --output "$archive" "$ndk_zip_url" &&
               unzip -tq "$archive" >/dev/null; then
              unzip -q "$archive" -d "$extract_dir"
              if [ -f "$extract_dir/$ndk_folder/source.properties" ]; then
                mv "$extract_dir/$ndk_folder" "$target"
                test -f "$target/source.properties"
                echo "NDK $ndk_version installed from validated direct archive."
                exit 0
              fi
            fi
            sleep $((attempt * 4))
          done

          echo "NDK installation failed from both sdkmanager and direct download."
          exit 1

      - name: Prepare release signing
        if: github.event_name != 'pull_request' && env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/darkvibex-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: env.ANDROID_KEYSTORE_PATH == ''
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=DARKVIBEX_API_ORIGIN="$DVX_API_ORIGIN" --dart-define=DARKVIBEX_PUSH_CONFIGURED="$DVX_PUSH_CONFIGURED"

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_PATH != ''
        working-directory: apps/mobile
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --dart-define=DARKVIBEX_API_ORIGIN="$DVX_API_ORIGIN" --dart-define=DARKVIBEX_PUSH_CONFIGURED="$DVX_PUSH_CONFIGURED"

      - name: Print APK signing certificate fingerprint
        shell: bash
        continue-on-error: true
        run: |
          set -u
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            apk_path="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
            echo "APK type: signed release (stable signing key, if key is unchanged)"
          else
            apk_path="apps/mobile/build/app/outputs/flutter-apk/app-debug.apk"
            echo "APK type: CI debug (fingerprint may change on the next build)"
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            sdk_root="/usr/local/lib/android/sdk"
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ] || [ ! -x "$apksigner_path" ]; then
            echo "Could not locate apksigner under $sdk_root; SHA-1 output skipped."
            exit 0
          fi
          if [ ! -f "$apk_path" ]; then
            echo "APK not found at $apk_path; SHA-1 output skipped."
            exit 0
          fi
          cert_output="$("$apksigner_path" verify --print-certs "$apk_path" 2>&1)" || {
            echo "$cert_output"
            echo "Could not inspect APK certificate; SHA-1 output skipped."
            exit 0
          }
          echo "$cert_output"
          sha1="$(printf '%s\n' "$cert_output" | sed -nE 's/.*certificate SHA-1 digest: *([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
          if [ -z "$sha1" ]; then
            echo "SHA-1 line was not found in apksigner output."
            exit 0
          fi
          echo "APK_SIGNING_SHA1=$sha1"

      - name: Publish APK to rolling GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            apk="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
            asset_name="DarkVibeX-latest-release.apk"
          else
            apk="apps/mobile/build/app/outputs/flutter-apk/app-debug.apk"
            asset_name="DarkVibeX-latest-debug.apk"
          fi
          test -f "$apk"
          if ! gh release view darkvibex-latest >/dev/null 2>&1; then
            gh release create darkvibex-latest               --title "DarkVibeX Latest APK"               --notes "Rolling latest APK build from main. Asset is replaced on each successful build."
          fi
          cp "$apk" "$RUNNER_TEMP/$asset_name"
          gh release upload darkvibex-latest "$RUNNER_TEMP/$asset_name" --clobber

      - name: Mark APK build success
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=darkvibex/apk \
            -f description="DarkVibeX APK published" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/darkvibex-latest"

      - name: Mark APK build failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=darkvibex/apk \
            -f description="DarkVibeX APK build failed"


  direct-apk-alias:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark direct APK pending
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=darkvibex/direct-apk \
            -f description="Preparing direct APK link"

      - name: Publish stable direct APK alias
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dvx-apk"
          gh release download darkvibex-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "DarkVibeX-latest-*.apk" \
            --dir "$RUNNER_TEMP/dvx-apk" \
            --clobber
          apk="$(find "$RUNNER_TEMP/dvx-apk" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/DarkVibeX-latest.apk"
          gh release upload darkvibex-latest \
            "$RUNNER_TEMP/DarkVibeX-latest.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Mark direct APK success
        if: success()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=darkvibex/direct-apk \
            -f description="Direct APK is ready" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/darkvibex-latest/DarkVibeX-latest.apk"

      - name: Mark direct APK failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=darkvibex/direct-apk \
            -f description="Direct APK alias failed"
