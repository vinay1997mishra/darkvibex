name: DarkVibeX Safe Base Check

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject legacy hierarchy references
        run: node tools/check-no-legacy-hierarchy.mjs
      - name: Verify Android identity
        run: |
          grep -q 'applicationId = "com.darkvibex.app"' apps/mobile/android/app/build.gradle.kts
          grep -q 'namespace = "com.darkvibex.app"' apps/mobile/android/app/build.gradle.kts
          grep -q 'android:label="DarkVibeX"' apps/mobile/android/app/src/main/AndroidManifest.xml
