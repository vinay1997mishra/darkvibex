name: DarkVibeX Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/owner_panel/**"
      - ".github/workflows/darkvibex-worker-deploy.yml"

concurrency:
  group: darkvibex-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy blocked: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this GitHub repository's Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: apps/worker
        run: npm install --no-audit --no-fund

      - name: Verify Worker tests
        working-directory: apps/worker
        run: |
          npm run check
          npm test

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy

      - name: Verify deployed Worker and Google auth config
        shell: bash
        run: |
          set -euo pipefail
          base="https://darkvibex-api.mishrajii7991.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/health"
          echo
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/api/auth/config" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);if(!c.ok||!c.google_web_client_id){console.error("Google auth config is missing.");process.exit(1)}console.log("Google auth config is present.")})'
          app_config="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/api/config")"
          APP_CONFIG="$app_config" node -e 'const c=JSON.parse(process.env.APP_CONFIG||"{}");const r=c?.settings?.["feature.room_creation"];if(!c.ok||r?.enabled===false){console.error("Room creation is disabled after deploy.");process.exit(1)}console.log("Room creation is enabled.")'
          auth_probe="$(curl --silent --show-error --request POST "$base/api/session/google" -H 'content-type: application/json' --data '{"id_token":""}')"
          AUTH_PROBE="$auth_probe" node -e 'const c=JSON.parse(process.env.AUTH_PROBE||"{}");if(c.error!=="google_id_token_required"){console.error("Google session endpoint is not ready:",c.error||"unknown_error");process.exit(1)}console.log("Google session endpoint and SESSION_SECRET are ready.")'

          probe_user="deploy_room_probe"
          probe_session="$(curl --fail-with-body --silent --show-error --request POST "$base/api/session/guest" -H 'content-type: application/json' --data '{"user_id":"deploy_room_probe","display_name":"Deploy Probe"}')"
          probe_token="$(PROBE_SESSION="$probe_session" node -e 'const c=JSON.parse(process.env.PROBE_SESSION||"{}");if(!c.ok||!c.token){console.error("Guest probe session failed:",c.error||"missing_token");process.exit(1)}process.stdout.write(c.token)')"
          probe_profile="$(curl --fail-with-body --silent --show-error --request POST "$base/api/users/profile" -H 'content-type: application/json' -H "authorization: Bearer $probe_token" --data '{"user_id":"deploy_room_probe","display_name":"Deploy Probe","country_code":"IN","country_name":"India","flag_emoji":"🇮🇳","language":"English"}')"
          PROBE_PROFILE="$probe_profile" node -e 'const c=JSON.parse(process.env.PROBE_PROFILE||"{}");if(!c.ok){console.error("Probe profile setup failed:",c.error||"unknown_error");process.exit(1)}console.log("Probe country profile is ready.")'
          probe_room="$(curl --fail-with-body --silent --show-error --request POST "$base/api/rooms" -H 'content-type: application/json' -H "authorization: Bearer $probe_token" --data '{"owner_user_id":"deploy_room_probe","owner_name":"Deploy Probe","name":"Deploy Probe Room","seat_count":12,"party_mode":"Friends-making Party","room_mode":"voice"}')"
          probe_room_id="$(PROBE_ROOM="$probe_room" node -e 'const c=JSON.parse(process.env.PROBE_ROOM||"{}");if(!c.ok||!c.room_id){console.error("Room create probe failed:",c.error||"missing_room_id");process.exit(1)}process.stdout.write(String(c.room_id))')"
          probe_delete="$(curl --fail-with-body --silent --show-error --request POST "$base/api/rooms/$probe_room_id/delete" -H 'content-type: application/json' -H "authorization: Bearer $probe_token" --data '{"user_id":"deploy_room_probe"}')"
          PROBE_DELETE="$probe_delete" node -e 'const c=JSON.parse(process.env.PROBE_DELETE||"{}");if(!c.ok){console.error("Room cleanup probe failed:",c.error||"unknown_error");process.exit(1)}console.log("End-to-end room create/delete probe passed.")'
