name: DarkVibeX Worker Deploy

# Production auth and core Worker route smoke checks run before a deploy is accepted.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/owner_panel/**"
      - ".github/workflows/darkvibex-worker-deploy.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: darkvibex-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Mark Worker deploy pending
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=darkvibex/worker-deploy \
            -f description="DarkVibeX Worker deploy is running"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy blocked: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this GitHub repository's Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: apps/worker
        run: npm install --no-audit --no-fund

      - name: Verify Worker tests
        working-directory: apps/worker
        run: |
          npm run check
          npm test

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy

      - name: Verify deployed Worker and Google auth config
        shell: bash
        run: |
          set -euo pipefail
          base="https://darkvibex-api.mishrajii7991.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/health"
          echo
          studio_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/creator-studio/")"
          if [ "$studio_code" != "404" ]; then
            echo "Removed editor route must return HTTP 404; received $studio_code."
            exit 1
          fi
          echo "Removed editor route correctly returns HTTP 404."
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/api/auth/config" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);if(!c.ok||!c.google_web_client_id){console.error("Google auth config is missing.");process.exit(1)}console.log("Google auth config is present.")})'
          app_config="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/api/config")"
          APP_CONFIG="$app_config" node -e 'const c=JSON.parse(process.env.APP_CONFIG||"{}");const r=c?.settings?.["feature.room_creation"];if(!c.ok||r?.enabled===false){console.error("Room creation is disabled after deploy.");process.exit(1)}console.log("Room creation is enabled.")'
          auth_probe="$(curl --silent --show-error --request POST "$base/api/session/google" -H 'content-type: application/json' --data '{"id_token":""}')"
          AUTH_PROBE="$auth_probe" node -e 'const c=JSON.parse(process.env.AUTH_PROBE||"{}");if(c.error!=="google_id_token_required"){console.error("Google session endpoint is not ready:",c.error||"unknown_error");process.exit(1)}console.log("Google session endpoint and SESSION_SECRET are ready.")'

          guest_tmp="$(mktemp)"
          guest_code="$(curl --silent --show-error --output "$guest_tmp" --write-out '%{http_code}' --request POST "$base/api/session/guest" -H 'content-type: application/json' --data '{"user_id":"deploy_guest_probe","display_name":"Deploy Guest Probe"}')"
          guest_body="$(cat "$guest_tmp")"
          rm -f "$guest_tmp"
          GUEST_BODY="$guest_body" GUEST_CODE="$guest_code" node -e 'const c=JSON.parse(process.env.GUEST_BODY||"{}");if(process.env.GUEST_CODE!=="403"||c.error!=="guest_login_disabled"){console.error("Guest login must stay disabled:",process.env.GUEST_CODE,c.error||"unknown_error");process.exit(1)}console.log("Guest login is disabled.")'

          upsert_tmp="$(mktemp)"
          upsert_code="$(curl --silent --show-error --output "$upsert_tmp" --write-out '%{http_code}' --request POST "$base/api/users/upsert" -H 'content-type: application/json' --data '{"user_id":"deploy_upsert_probe","display_name":"Unauthenticated Probe"}')"
          upsert_body="$(cat "$upsert_tmp")"
          rm -f "$upsert_tmp"
          UPSERT_BODY="$upsert_body" UPSERT_CODE="$upsert_code" node -e 'const c=JSON.parse(process.env.UPSERT_BODY||"{}");if(process.env.UPSERT_CODE!=="401"||c.error!=="unauthorized"){console.error("Unauthenticated user upsert must be blocked:",process.env.UPSERT_CODE,c.error||"unknown_error");process.exit(1)}console.log("Unauthenticated user creation is blocked.")'

      - name: Mark Worker deploy success
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=darkvibex/worker-deploy \
            -f description="DarkVibeX Worker deployed successfully"

      - name: Mark Worker deploy failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=darkvibex/worker-deploy \
            -f description="DarkVibeX Worker deploy failed"
